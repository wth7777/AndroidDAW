plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.simpledawexample'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.simpledawexample"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // NDK configuration
        externalNativeBuild {
            cmake {
                cppArgs "-std=c++17 -O3 -flto"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2"
        }
    }

    packagingOptions {
        // Required for Oboe native libraries
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "androidx.activity:activity-compose:1.8.0"
    implementation "androidx.compose.ui:ui:1.6.7"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.7"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"
    // Oboe dependency - we'll add it as a local source for now
    // implementation "com.github.google.oboe:oboe:2.0.0"
}