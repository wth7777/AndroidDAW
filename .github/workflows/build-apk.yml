name: Build Android DAW APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: 8.5
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          mkdir -p $HOME/gradle
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -qq gradle-${GRADLE_VERSION}-bin.zip -d $HOME/gradle
          export GRADLE_HOME=$HOME/gradle/gradle-${GRADLE_VERSION}
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle --version

      - name: Install Android SDK command line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -qq commandlinetools-linux-12266719_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platforms and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.2.9519653"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk